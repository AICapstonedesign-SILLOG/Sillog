<script>
(() => {
  'use strict';

  const KINDS = {
    ref:     { name: '참고자료',    color: '#00929e' },
    out:     { name: '산출물',      color: '#b48f3c' },
    app:     { name: '앱',          color: '#915a95' },
    topic:   { name: '주제',        color: '#5a9e6a' },
    problem: { name: '문제',        color: '#ab5242' },
    later:   { name: '나중에 할 일', color: '#6885c3' },
  };
  const SWITCH = {
    planned: { name: '계획대로', color: 'rgb(127,142,163)' },
    blocked: { name: '막혀서',   color: 'rgb(180,143,60)' },
    drift:   { name: '딴짓',     color: 'rgb(171,82,66)' },
  };
  const THEMES = [{ id: 'etc', name: '기타', color: '#9b9490' }];  // 앱이 setGraph로 실제 분류를 채운다
  const T = (id, theme, title, sum, win, w, ref, out, apps, topics, problems, later) =>
    ({ id, theme, title, sum, win, w, ref, out, apps, topics, problems, later });
  const TASKS = [];  // 앱이 setGraph로 실제 업무를 채운다
  const MODE_NAME = { map: '업무 지도', cosmos: '연결망', sky: '연결망', orbit: '원형 트리', sunburst: '원형 비중', branch: '가지 도표', ring: '원형 연결', radial: '방사형 트리', layer: '층별 흐름', bubble: '동심원 버블',
                      tree: '시간 비중', flow: '시간 흐름', path: '전환 경로', gantt: '간트', cal: '달력' };
  const TASK = Object.fromEntries(TASKS.map(t => [t.id, t]));
  const THEME = Object.fromEntries(THEMES.map(t => [t.id, t]));

  // 2주치 세션을 고정 시드로 만든다. 0일 = 9/19, 13일 = 10/2(오늘)
  let DAYS = 14;
  let NOW_MIN = 19 * 60 + 45;
  let dayDate = d => new Date(2026, 8, 19 + d);
  const WEEK = ['일', '월', '화', '수', '목', '금', '토'];
  const md = d => { const x = dayDate(d); return `${x.getMonth() + 1}/${x.getDate()}`; };
  const R = (s => () => (s = (Math.imul(s, 1664525) + 1013904223) >>> 0) / 4294967296)(20261002);
  const pick = list => list[Math.floor(R() * list.length)];
  const weighted = list => {
    let r = R() * list.reduce((a, t) => a + t.w, 0);
    for (const t of list) if ((r -= t.w) < 0) return t;
    return list[list.length - 1];
  };
  const SESSIONS = [];
  for (let d = 0; d < DAYS; d++) {
    const wd = dayDate(d).getDay(), weekend = wd === 0 || wd === 6;
    const active = TASKS.filter(t => t.theme !== 'etc' && d >= t.win[0] && d <= t.win[1]);
    const etc = TASKS.filter(t => t.theme === 'etc');
    const end = d === DAYS - 1 ? NOW_MIN - 5 : (weekend ? 17 * 60 : 22 * 60 + 30) + Math.floor(R() * 60);
    let t = 9 * 60 + 30 + Math.floor(R() * 90), prev = null;
    while (t < end - 15 && active.length) {
      const r = R();
      const same = prev && prev.task.theme !== 'etc' ? active.filter(x => x.theme === prev.task.theme && x !== prev.task) : [];
      let task;
      if (same.length && r < 0.4) task = weighted(same);
      else if (r < 0.55) task = pick(etc);
      else task = weighted(active.filter(x => !prev || x !== prev.task)) || weighted(active);
      const isEtc = task.theme === 'etc';
      const dur = Math.round(isEtc ? 6 + R() * 16 : 18 + R() * 62);
      const s = { task, d, start: t, end: Math.min(t + dur, end), app: pick(task.apps), kind: null };
      if (prev && t - prev.end < 40) s.kind = isEtc ? 'drift' : (prev.task.problems.length && R() < 0.55 ? 'blocked' : 'planned');
      SESSIONS.push(s);
      prev = s;
      t = s.end + (R() < 0.12 ? 45 + Math.floor(R() * 60) : Math.floor(R() * 10));
    }
  }

  const $ = id => document.getElementById(id);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const fmt = m => { m = Math.round(m); const h = Math.floor(m / 60), r = m % 60; return h ? (r ? `${h}시간 ${r}분` : `${h}시간`) : `${r}분`; };
  const hm = m => `${String(Math.floor(m / 60)).padStart(2, '0')}:${String(m % 60).padStart(2, '0')}`;
  const hash = s => [...s].reduce((a, c) => (a * 31 + c.charCodeAt(0)) >>> 0, 7);
  const pct = m => ((m - 480) / 960) * 100;  // 08:00~24:00 축

  const state = { mode: 'cosmos', range: 'all', q: '', themesOff: new Set(), kindsOff: new Set(), showEtc: false, showLinks: true,
                  detail: null, focus: null, dview: 'cols', day: DAYS - 1, rel: new Map() };

  const inRange = s => state.range === 'all' || (state.range === 'today' ? s.d === DAYS - 1 : s.d >= DAYS - 7);
  const statsOf = t => {
    const ss = SESSIONS.filter(s => s.task === t && inRange(s));
    return { ss, mins: ss.reduce((a, s) => a + s.end - s.start, 0), first: ss[0], last: ss[ss.length - 1] };
  };
  const lastLabel = s => !s ? '-' : s.d === DAYS - 1 ? `오늘 ${hm(s.end)}` : s.d === DAYS - 2 ? '어제' : `${DAYS - 1 - s.d}일 전`;
  const itemsOf = t => [
    ['ref', t.ref, 'r:'], ['out', t.out, 'r:'], ['app', t.apps, null], ['topic', t.topics, 't:'],
    ['problem', t.problems.map(p => p[0]), null], ['later', t.later, null],
  ];
  const keysOf = t => new Set([...t.ref, ...t.out].map(n => 'r:' + n).concat(t.topics.map(n => 't:' + n)));
  const related = (t, pool) => {
    const mine = keysOf(t), out = new Map();
    for (const o of pool) {
      if (o === t || o.theme === 'etc') continue;
      const shared = [...keysOf(o)].filter(k => mine.has(k));
      if (shared.length) out.set(o.id, shared);
    }
    return out;
  };
  const keyName = k => k.slice(2);
  const matches = t => !state.q || [t.title, t.sum, ...itemsOf(t).flatMap(([, items]) => items)].join(' ').toLowerCase().includes(state.q);
  const visibleTasks = () => TASKS.filter(t => !state.themesOff.has(t.theme) && matches(t) && statsOf(t).ss.length);

  /* ---------- 업무 지도 ---------- */
  function renderMap() {
    const pool = visibleTasks();
    const shareCnt = new Map();
    pool.forEach(t => keysOf(t).forEach(k => shareCnt.set(k, (shareCnt.get(k) || 0) + 1)));
    state.rel = new Map(pool.map(t => [t.id, related(t, pool)]));
    const focus = pool.includes(TASK[state.focus]) ? TASK[state.focus] : null;
    if (!focus) state.focus = null;
    const rest = focus ? pool.filter(t => t !== focus) : pool;
    const linked = focus ? state.rel.get(focus.id) : new Map();

    const themes = THEMES.map(th => {
      const ts = rest.filter(t => t.theme === th.id).map(t => ({ t, st: statsOf(t) }))
                     .sort((a, b) => (b.st.last.d * 1440 + b.st.last.end) - (a.st.last.d * 1440 + a.st.last.end));
      return { th, ts, mins: ts.reduce((a, x) => a + x.st.mins, 0), recent: ts.length ? ts[0].st.last.d * 1440 + ts[0].st.last.end : -1 };
    }).filter(g => g.ts.length)
      .sort((a, b) => (a.th.id === 'etc') - (b.th.id === 'etc') || b.recent - a.recent);

    const html = themes.map(({ th, ts, mins }) => {
      const meta = `업무 ${ts.length}개, ${fmt(mins)}`;
      if (th.id === 'etc' && !state.showEtc) {
        return `<section class="theme"><button type="button" class="theme-head" data-act="etc"><h2>${th.name}</h2><span class="meta">${meta}, 업무 그래프에서 제외</span><span class="fold">펼치기</span></button></section>`;
      }
      return `<section class="theme"><header class="theme-head"><h2>${th.name}</h2><span class="meta">${meta}</span></header>
        <div class="cards">${ts.map(({ t, st }) => cardHTML(t, st, shareCnt, linked.has(t.id))).join('')}</div></section>`;
    }).join('');

    $('main').innerHTML = pool.length
      ? (focus ? hubHTML(focus, shareCnt) + `<h2 class="rest-head">다른 업무 ${rest.filter(t => t.theme !== 'etc').length}개</h2>`
               : hubEmptyHTML() + `<h2 class="rest-head">업무 ${rest.filter(t => t.theme !== 'etc').length}개</h2>`)
        + `<div class="map" id="map"><svg id="links"></svg>${html}</div>`
      : `<p class="empty-note">조건에 맞는 업무가 없습니다</p>`;
    if (focus) drawHubLines();
    const nShown = pool.filter(t => t.theme !== 'etc').length;
    $('stats').textContent = `업무 ${nShown}개, 상위 분류 ${themes.filter(g => g.th.id !== 'etc').length}개, 세션 ${SESSIONS.filter(s => inRange(s) && pool.includes(s.task)).length}개`;
    renderKinds(pool);
  }

  function stripHTML(t) {
    return Array.from({ length: 7 }, (_, i) => {
      const d = DAYS - 7 + i;
      const m = SESSIONS.filter(s => s.task === t && s.d === d).reduce((a, s) => a + s.end - s.start, 0);
      return m ? `<i style="opacity:${(0.3 + 0.7 * Math.min(1, m / 150)).toFixed(2)}" title="${md(d)} ${fmt(m)}"></i>` : `<i class="none" title="${md(d)} 기록 없음"></i>`;
    }).join('');
  }

  function cardHTML(t, st, shareCnt, isLinked) {
    const rows = itemsOf(t).filter(([k, items]) => items.length && !state.kindsOff.has(k)).map(([k, items, pre]) => {
      const sorted = pre ? [...items].sort((a, b) => (shareCnt.get(pre + b) || 0) - (shareCnt.get(pre + a) || 0)) : items;
      const cap = k === 'problem' || k === 'later' ? 1 : 3;
      const chips = sorted.slice(0, cap).map(n => `<span class="chip"${pre ? ` data-key="${esc(pre + n)}"` : ''}>${esc(n)}</span>`).join('');
      const more = sorted.length > cap ? `<span class="more">+${sorted.length - cap}</span>` : '';
      return `<div class="row"><dt><span class="dot" style="background:${KINDS[k].color}"></span>${KINDS[k].name}</dt><dd>${chips}${more}</dd></div>`;
    }).join('');
    const strip = stripHTML(t);
    const n = state.rel.get(t.id)?.size || 0;
    return `<article class="card${isLinked ? ' linked' : ''}" tabindex="0" draggable="true" data-id="${t.id}">
      <div class="card-top"><span class="dot"></span><h3>${esc(t.title)}</h3></div>
      ${n ? `<span class="badge">연결 ${n}</span>` : ''}
      ${t.sum ? `<p class="sum">${esc(t.sum)}</p>` : ''}
      <p class="meta"><span><b>${fmt(st.mins)}</b></span><span>세션 ${st.ss.length}개</span><span>${lastLabel(st.last)}</span></p>
      <div class="strip" aria-label="최근 7일 활동">${strip}</div>
      ${rows ? `<dl class="rows">${rows}</dl>` : ''}
    </article>`;
  }

  // 고른 업무를 가운데에 두고 연결된 것을 3×3 칸에 놓는다. 칸 위치는 종류마다 고정.
  const HUB_SLOTS = ['app', 'rel', 'problem', 'ref', null, 'out', 'later', 'topic', 'ses'];
  const slotMeta = slot => slot === 'rel' ? ['같은 맥락 업무', 'var(--accent)'] : slot === 'ses' ? ['최근 세션', '#7f8ea3'] : [KINDS[slot].name, KINDS[slot].color];
  const DROP_ICON = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v11"/><path d="M7.5 9.5 12 14l4.5-4.5"/><path d="M4 15v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/></svg>';
  function hubTile(slot, t, st, shareCnt) {
    const [name, color] = slotMeta(slot);
    let rows;
    if (slot === 'rel') {
      rows = [...(state.rel.get(t.id) || new Map())].sort((a, b) => b[1].length - a[1].length).map(([oid, shared]) =>
        `<li><button type="button" data-focus="${oid}" title="${esc(shared.map(keyName).join(', '))}"><span class="nm">${esc(TASK[oid].title)}</span><span class="ct">${shared.length}개 공유</span></button></li>`);
    } else if (slot === 'ses') {
      rows = st.ss.slice(-6).reverse().map(s => `<li><span class="nm">${md(s.d)} ${hm(s.start)}, ${esc(s.app)}</span><span class="ct">${fmt(s.end - s.start)}</span></li>`);
    } else {
      const [, items, pre] = itemsOf(t).find(([k]) => k === slot);
      rows = state.kindsOff.has(slot) ? [] : slot === 'problem'
        ? t.problems.map(([n, src]) => `<li><span class="nm">${esc(n)}</span><span class="ct">${esc(src)}</span></li>`)
        : items.map(n => {
            const more = pre ? (shareCnt.get(pre + n) || 1) - 1 : 0;
            return `<li${pre ? ` data-key="${esc(pre + n)}"` : ''}><span class="nm">${esc(n)}</span>${more ? `<span class="ct sh">업무 ${more}개 더</span>` : ''}</li>`;
          });
    }
    const cap = 5, list = rows.slice(0, cap).join('') + (rows.length > cap ? `<li class="more">+${rows.length - cap}</li>` : '');
    return `<div class="hslot${rows.length ? ' on' : ''}" data-slot="${slot}">
      <header><span class="ic"><span class="dot" style="background:${color}"></span></span><h3>${name}</h3><span class="n">${rows.length || ''}</span></header>
      ${rows.length ? `<ul>${list}</ul>` : '<p class="none">없음</p>'}</div>`;
  }

  function hubHTML(t, shareCnt) {
    const st = statsOf(t);
    const tiles = HUB_SLOTS.map(slot => slot ? hubTile(slot, t, st, shareCnt)
      : `<div class="hslot core" data-slot="core"><div class="disc"><span>${THEME[t.theme].name}</span><b>${fmt(st.mins)}</b><span>세션 ${st.ss.length}개</span></div></div>`).join('');
    return `<section class="hub" aria-label="고른 업무">
      <div class="hub-top"><span class="dot"></span><b>${esc(t.title)}</b><button type="button" data-act="unfocus">닫기</button></div>
      <div class="hub-grid" id="hubgrid"><svg id="hublines" aria-hidden="true"></svg>${tiles}</div>
    </section>`;
  }

  // 업무를 고르기 전: 같은 판을 값 없이 보여 주고 끌어다 놓기를 받는다
  function hubEmptyHTML() {
    const tiles = HUB_SLOTS.map(slot => {
      if (!slot) return `<div class="hslot core" data-slot="core"><div class="disc wait">${DROP_ICON}<span>여기에 놓기</span></div></div>`;
      const [name, color] = slotMeta(slot);
      return `<div class="hslot" data-slot="${slot}"><header><span class="ic"><span class="dot" style="background:${color}"></span></span><h3>${name}</h3></header><div class="sk"><i></i><i></i><i></i></div></div>`;
    }).join('');
    return `<section class="hub empty" aria-label="업무 선택 판">
      <p class="hub-hint">${DROP_ICON}<span>아래 업무 카드를 이 판으로 끌어다 놓거나 카드를 누르면, 그 업무와 연결된 앱, 자료, 주제, 세션이 칸마다 표시됩니다.</span></p>
      <div class="hub-grid">${tiles}</div>
    </section>`;
  }

  function drawHubLines() {
    const g = $('hubgrid');
    if (!g) return;
    const box = g.getBoundingClientRect(), c = g.querySelector('.disc').getBoundingClientRect();
    const cx = c.left + c.width / 2 - box.left, cy = c.top + c.height / 2 - box.top;
    const svg = $('hublines');
    svg.setAttribute('width', box.width);
    svg.setAttribute('height', box.height);
    svg.innerHTML = [...g.querySelectorAll('.hslot.on')].map(el => {
      const r = el.getBoundingClientRect();
      return `<line data-slot="${el.dataset.slot}" x1="${cx}" y1="${cy}" x2="${r.left + r.width / 2 - box.left}" y2="${r.top + r.height / 2 - box.top}"/>`;
    }).join('');
  }

  // 판의 자료나 주제에 마우스를 올리면 아래 카드 중 같은 것을 쓴 업무만 남긴다
  function hubHover(e) {
    const g = $('hubgrid');
    if (!g) return;
    const tile = e.target.closest('.hslot.on'), key = e.target.closest('[data-key]')?.dataset.key;
    g.querySelectorAll('#hublines line').forEach(l => l.classList.toggle('hot', !!tile && l.dataset.slot === tile.dataset.slot));
    document.querySelectorAll('#map .card').forEach(card => {
      const hit = !!key && keysOf(TASK[card.dataset.id]).has(key);
      card.classList.toggle('keyhit', hit);
      card.classList.toggle('keydim', !!key && !hit);
    });
  }

  let hot = null;
  function highlight(id) {
    if (hot === id) return;
    hot = id;
    const map = $('map');
    if (!map) return;
    const rel = id ? state.rel.get(id) || new Map() : new Map();
    const hotKeys = new Set([...rel.values()].flat());
    map.querySelectorAll('.card').forEach(card => {
      const cid = card.dataset.id;
      card.classList.toggle('hot', cid === id);
      card.classList.toggle('rel', rel.has(cid));
      card.classList.toggle('dim', !!id && cid !== id && !rel.has(cid));
      const keys = cid === id ? hotKeys : new Set(rel.get(cid) || []);
      card.querySelectorAll('.chip[data-key]').forEach(c => c.classList.toggle('shared', keys.has(c.dataset.key)));
    });
    drawLinks(id, rel);
  }

  function drawLinks(id, rel) {
    const svg = $('links'), map = $('map');
    svg.innerHTML = '';
    if (!id || !state.showLinks || !rel.size) return;
    const box = map.getBoundingClientRect();
    svg.setAttribute('width', map.scrollWidth);
    svg.setAttribute('height', map.scrollHeight);
    const rectOf = el => {
      const r = el.getBoundingClientRect();
      const x = r.left - box.left, y = r.top - box.top;
      return { l: x, r: x + r.width, t: y, b: y + r.height, cx: x + r.width / 2, cy: y + r.height / 2 };
    };
    const a = rectOf(map.querySelector(`.card[data-id="${id}"]`));
    const N = { r: [1, 0], l: [-1, 0], t: [0, -1], b: [0, 1] };
    const pt = (r, side) => side === 'r' ? [r.r, r.cy] : side === 'l' ? [r.l, r.cy] : side === 't' ? [r.cx, r.t] : [r.cx, r.b];
    let out = '';
    rel.forEach((shared, oid) => {
      const el = map.querySelector(`.card[data-id="${oid}"]`);
      if (!el) return;
      const b = rectOf(el);
      const sameRow = Math.abs(a.t - b.t) < 30;
      const [s1, s2] = sameRow ? (b.cx > a.cx ? ['r', 'l'] : ['l', 'r']) : (b.cy > a.cy ? ['b', 't'] : ['t', 'b']);
      const p1 = pt(a, s1), p2 = pt(b, s2);
      const k = Math.min(90, Math.hypot(p2[0] - p1[0], p2[1] - p1[1]) / 3);
      const c1 = [p1[0] + N[s1][0] * k, p1[1] + N[s1][1] * k], c2 = [p2[0] + N[s2][0] * k, p2[1] + N[s2][1] * k];
      const mx = (p1[0] + 3 * c1[0] + 3 * c2[0] + p2[0]) / 8, my = (p1[1] + 3 * c1[1] + 3 * c2[1] + p2[1]) / 8;
      const label = keyName(shared[0]) + (shared.length > 1 ? ` 외 ${shared.length - 1}` : '');
      out += `<path d="M${p1} C${c1} ${c2} ${p2}"/><circle cx="${p1[0]}" cy="${p1[1]}" r="3"/><circle cx="${p2[0]}" cy="${p2[1]}" r="3"/>`
           + `<text x="${mx}" y="${my + 4}" text-anchor="middle">${esc(label)}</text>`;
    });
    svg.innerHTML = out;
  }

  /* ---------- 업무 상세 ---------- */
  function renderDetail() {
    const t = TASK[state.detail], th = THEME[t.theme], st = statsOf(t);
    const all = SESSIONS.filter(s => s.task === t);
    const rel = related(t, TASKS);
    const props = [['작업 시간', fmt(st.mins)], ['세션', `${st.ss.length}개`], ['처음 시작', all.length ? md(all[0].d) : '-'], ['마지막 활동', lastLabel(all[all.length - 1])]];
    const body = state.dview === 'cols' ? colsHTML(t, st, rel) : `<div class="relwrap">${relationSVG(t, rel)}</div>`;
    const links = [...rel].map(([oid, shared]) => `<li><button type="button" data-open="${oid}"><span class="dot"></span><span class="name">${esc(TASK[oid].title)}</span><span class="meta">${shared.map(k => esc(keyName(k))).join(', ')}</span></button></li>`).join('');

    const days = [...new Set(st.ss.map(s => s.d))].sort((a, b) => b - a);
    const axis = `<div class="axis">${[8, 10, 12, 14, 16, 18, 20, 22, 24].map(h => `<span style="left:${pct(h * 60)}%">${String(h).padStart(2, '0')}</span>`).join('')}</div>`;
    const dayRows = days.map(d => {
      const ss = st.ss.filter(s => s.d === d);
      return `<div class="day"><span class="dl">${md(d)} (${WEEK[dayDate(d).getDay()]})</span><div class="track">${ss.map(s =>
        `<span class="bar" style="left:${pct(s.start)}%;width:${pct(s.end) - pct(s.start)}%" title="${hm(s.start)}~${hm(s.end)}, ${fmt(s.end - s.start)}, ${esc(s.app)}"></span>`).join('')}</div>
        <span class="ds">${fmt(ss.reduce((a, s) => a + s.end - s.start, 0))}</span></div>`;
    }).join('');

    // 날짜별 작업 시간 (14일 전체)
    const dayMin = Array.from({ length: DAYS }, (_, d) => all.filter(s => s.d === d).reduce((a, s) => a + s.end - s.start, 0));
    const maxDay = Math.max(1, ...dayMin);
    const calHTML = `<div class="dcal">${dayMin.map((m, d) => {
      const wd = dayDate(d).getDay();
      return `<div class="dc${wd === 0 || wd === 6 ? ' we' : ''}${d === DAYS - 1 ? ' today' : ''}" title="${md(d)} ${m ? fmt(m) : '기록 없음'}"><span class="dd">${md(d)}<br>${d === DAYS - 1 ? '오늘' : WEEK[wd]}</span>`
           + `<span class="dbar"><i style="height:${(m / maxDay * 100).toFixed(0)}%"></i></span><span class="dm">${m ? fmt(m) : ''}</span></div>`;
    }).join('')}</div>`;

    // 오간 업무: 같은 날 40분 안에 이어진 세션의 앞뒤 업무 (기타 업무는 뺀다)
    const xin = new Map(), xout = new Map();
    SESSIONS.forEach((s, i) => {
      const q = SESSIONS[i - 1];
      if (!q || q.d !== s.d || s.start - q.end >= 40 || q.task === s.task) return;
      if (s.task === t && q.task.theme !== 'etc') xin.set(q.task, (xin.get(q.task) || 0) + 1);
      if (q.task === t && s.task.theme !== 'etc') xout.set(s.task, (xout.get(s.task) || 0) + 1);
    });
    const xferCol = (m, label) => {
      const rows = [...m].sort((a, b) => b[1] - a[1]), mx = Math.max(1, ...rows.map(r => r[1]));
      return `<div class="xcol"><h3>${label}</h3>${rows.length ? `<ul>${rows.map(([o, n]) => `<li><button type="button" data-open="${o.id}"><span class="name">${esc(o.title)}</span>`
        + `<span class="xbar"><i style="width:${(n / mx * 100).toFixed(0)}%"></i></span><span class="xn">${n}번</span></button></li>`).join('')}</ul>` : '<p class="xnone">없음</p>'}</div>`;
    };

    // 같은 분류 업무 기간: 세션이 있는 날을 이어 붙인 막대, 이 업무만 강조
    const runs = o => [...new Set(SESSIONS.filter(s => s.task === o).map(s => s.d))].sort((a, b) => a - b)
      .reduce((out, d) => { const r = out[out.length - 1]; if (r && d === r[1] + 1) r[1] = d; else out.push([d, d]); return out; }, []);
    const sibs = TASKS.filter(o => o.theme === t.theme && SESSIONS.some(s => s.task === o));
    const dayAxis = `<div class="axis">${[0, 3, 6, 9, DAYS - 1].map(d => `<span style="left:${((d + 0.5) / DAYS * 100).toFixed(2)}%">${d === DAYS - 1 ? '오늘' : md(d)}</span>`).join('')}</div>`;
    const ganttRows = sibs.map(o => {
      const me = o === t, mins = SESSIONS.filter(s => s.task === o).reduce((a, s) => a + s.end - s.start, 0);
      return `<div class="day${me ? ' me' : ''}"><button type="button" class="dl sibname"${me ? '' : ` data-open="${o.id}"`} title="${esc(o.title)}">${esc(o.title)}</button>`
           + `<div class="track d14">${runs(o).map(([a, b]) => `<span class="bar" style="left:${(a / DAYS * 100).toFixed(2)}%;width:${((b - a + 1) / DAYS * 100).toFixed(2)}%"></span>`).join('')}</div>`
           + `<span class="ds">${fmt(mins)}</span></div>`;
    }).join('');

    $('main').innerHTML = `
      <nav class="crumb"><button type="button" data-act="back">‹ ${MODE_NAME[state.mode]}</button><span>${th.name}</span></nav>
      <header class="dhead">
        <div>
          <p class="kind"><span class="dot"></span>업무 / ${th.name}</p>
          <h1>${esc(t.title)}</h1>
          ${t.sum ? `<p class="sum">${esc(t.sum)}</p>` : ''}
        </div>
        <dl class="props">${props.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>
        <div class="actions">
          <button type="button" class="primary">다시 열기</button>
          <div class="segmented two" id="dview" role="radiogroup" aria-label="상세 보기">
            <button type="button" data-dview="cols" class="${state.dview === 'cols' ? 'on' : ''}">열 보기</button>
            <button type="button" data-dview="graph" class="${state.dview === 'graph' ? 'on' : ''}">관계 보기</button>
          </div>
        </div>
      </header>
      ${body}
      ${links ? `<section class="block"><h2>같은 맥락의 업무 ${rel.size}개</h2><ul class="linklist">${links}</ul></section>` : ''}
      <section class="block"><h2>날짜별 작업 시간</h2>${calHTML}</section>
      <section class="block"><h2>하루 흐름</h2><div class="days">${days.length ? axis + dayRows : '<p class="empty-note">이 기간에 세션이 없습니다</p>'}</div></section>
      <section class="block"><h2>오간 업무</h2><div class="xfer">${xferCol(xin, '직전에 한 업무')}${xferCol(xout, '직후에 한 업무')}</div></section>
      <section class="block"><h2>같은 분류 업무 기간</h2><div class="days sib">${dayAxis}${ganttRows}</div></section>`;
    $('stats').textContent = `세션 ${st.ss.length}개, 연결된 업무 ${rel.size}개`;
    $('main').scrollTop = 0;
  }

  function colsHTML(t, st, rel) {
    const shareN = new Map();
    rel.forEach(keys => keys.forEach(k => shareN.set(k, (shareN.get(k) || 0) + 1)));
    const minutesFor = (items, share) => {
      const ws = items.map(n => (hash(n) % 7) + 2), sum = ws.reduce((a, b) => a + b, 0);
      return items.map((_, i) => st.mins * share * ws[i] / sum);
    };
    return `<div class="cols">${itemsOf(t).filter(([k]) => !state.kindsOff.has(k)).map(([k, items, pre]) => {
      const mins = k === 'app' ? minutesFor(items, 1) : (k === 'ref' || k === 'out') ? minutesFor(items, 0.6) : [];
      const lis = items.map((n, i) => {
        const shared = pre ? shareN.get(pre + n) : 0;
        let meta = shared ? `<span class="meta shared">공유 ${shared}</span>` : mins.length ? `<span class="meta">${fmt(mins[i])}</span>` : '';
        let sub = '';
        if (k === 'problem' && t.problems[i][1]) sub = `<span class="sub">해결: ${esc(t.problems[i][1])}</span>`;
        return `<li><span class="name">${esc(n)}${sub}</span>${meta}</li>`;
      }).join('');
      return `<section class="col${items.length ? '' : ' empty'}"><h3><span class="dot" style="background:${KINDS[k].color}"></span>${KINDS[k].name}<span class="count">${items.length}</span></h3><ul>${lis || '<li><span class="name" style="color:var(--muted)">없음</span></li>'}</ul></section>`;
    }).join('')}</div>`;
  }

  function relationSVG(t, rel) {
    const W = 1100, H = 660, cx = 550, cy = 330;
    const groups = itemsOf(t).filter(([k, items]) => items.length && !state.kindsOff.has(k));
    const total = groups.reduce((a, [, items]) => a + items.length, 0);
    let a0 = -Math.PI / 2;
    const nodes = [], sectors = [];
    groups.forEach(([k, items, pre]) => {
      const span = (2 * Math.PI * items.length) / total;
      items.forEach((name, i) => {
        const a = a0 + span * (i + 0.5) / items.length, r = 190 + (i % 2 ? 34 : 0);
        nodes.push({ k, name, key: pre ? pre + name : null, a, x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) });
      });
      sectors.push({ k, a: a0 + span / 2 });
      a0 += span;
    });
    const byKey = new Map(nodes.filter(n => n.key).map(n => [n.key, n]));
    const byName = new Map(nodes.map(n => [n.k + ':' + n.name, n]));

    // 같은 맥락의 다른 업무는 바깥 원에, 공유하는 노드들의 평균 각도에 둔다
    const ghosts = [...rel].map(([oid, keys]) => {
      const ns = keys.map(k => byKey.get(k)).filter(Boolean);
      const a = Math.atan2(ns.reduce((s, n) => s + Math.sin(n.a), 0), ns.reduce((s, n) => s + Math.cos(n.a), 0));
      return { oid, ns, a };
    }).filter(g => g.ns.length).sort((p, q) => p.a - q.a);
    for (let i = 1; i < ghosts.length; i++) if (ghosts[i].a - ghosts[i - 1].a < 0.3) ghosts[i].a = ghosts[i - 1].a + 0.3;
    ghosts.forEach(g => { g.x = cx + 300 * Math.cos(g.a); g.y = cy + 300 * Math.sin(g.a); });

    const anchor = a => Math.cos(a) > 0.25 ? 'start' : Math.cos(a) < -0.25 ? 'end' : 'middle';
    const lx = (x, a) => x + (Math.cos(a) > 0.25 ? 9 : Math.cos(a) < -0.25 ? -9 : 0);
    const ly = (y, a) => y + 4 + (Math.abs(Math.cos(a)) <= 0.25 ? (Math.sin(a) > 0 ? 19 : -14) : 0);
    const short = s => s.length > 16 ? s.slice(0, 15) + '…' : s;

    let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(t.title)} 관계">`;
    s += nodes.map(n => `<line x1="${cx}" y1="${cy}" x2="${n.x}" y2="${n.y}" stroke="rgba(36, 21, 15, 0.13)"/>`).join('');
    t.problems.forEach(([p, by]) => {
      const a = byName.get('problem:' + p), b = byKey.get('r:' + by);
      if (a && b) s += `<path d="M${a.x},${a.y} Q${cx},${cy} ${b.x},${b.y}" fill="none" stroke="rgba(171,82,66,0.7)" stroke-dasharray="4 3"/>`;
    });
    ghosts.forEach(g => g.ns.forEach(n => { s += `<line x1="${n.x}" y1="${n.y}" x2="${g.x}" y2="${g.y}" stroke="rgba(94, 143, 179, 0.5)" stroke-dasharray="4 3"/>`; }));
    sectors.forEach(sec => {
      const x = cx + 105 * Math.cos(sec.a), y = cy + 105 * Math.sin(sec.a);
      s += `<text class="lbl-muted" x="${x}" y="${y + 4}" text-anchor="middle">${KINDS[sec.k].name}</text>`;
    });
    nodes.forEach(n => {
      s += `<g><title>${KINDS[n.k].name}: ${esc(n.name)}</title><circle cx="${n.x}" cy="${n.y}" r="5" fill="${KINDS[n.k].color}"/>`
         + `<text x="${lx(n.x, n.a)}" y="${ly(n.y, n.a)}" text-anchor="${anchor(n.a)}">${esc(short(n.name))}</text></g>`;
    });
    ghosts.forEach(g => {
      s += `<g class="ghost" data-open="${g.oid}"><title>${esc(TASK[g.oid].title)}</title><circle cx="${g.x}" cy="${g.y}" r="7" fill="${'#ffffff'}" stroke="#5e8fb3" stroke-width="1.5"/>`
         + `<text x="${lx(g.x, g.a)}" y="${ly(g.y, g.a)}" text-anchor="${anchor(g.a)}">${esc(short(TASK[g.oid].title))}</text></g>`;
    });
    s += `<circle cx="${cx}" cy="${cy}" r="11" fill="#5e8fb3"/><text x="${cx}" y="${cy + 30}" text-anchor="middle" font-weight="600" font-size="13">${esc(t.title)}</text>`;
    return s + '</svg>';
  }

  /* ---------- 시간 흐름 ---------- */
  function renderFlow() {
    const d = state.day;
    const date = dayDate(d);
    $('dayLabel').textContent = `${md(d)} (${WEEK[date.getDay()]})`;
    $('prevDay').disabled = d === 0;
    $('nextDay').disabled = d === DAYS - 1;

    const ss = SESSIONS.filter(s => s.d === d && !state.themesOff.has(s.task.theme) && matches(s.task));
    const rowKey = s => s.task.theme === 'etc' && !state.showEtc ? 'etc' : s.task.id;
    const rows = [];
    THEMES.forEach(th => {
      const ts = TASKS.filter(t => t.theme === th.id && ss.some(s => s.task === t));
      if (!ts.length) return;
      rows.push({ type: 'theme', name: th.name });
      if (th.id === 'etc' && !state.showEtc) rows.push({ type: 'task', id: 'etc', title: `기타 업무 ${ts.length}개`, etc: true });
      else ts.forEach(t => rows.push({ type: 'task', id: t.id, title: t.title, etc: th.id === 'etc' }));
    });
    const rowIndex = new Map(rows.map((r, i) => [r.id, i]).filter(([id]) => id));
    const ROW = 30;

    let lines = '';
    const count = { planned: 0, blocked: 0, drift: 0 };
    for (let i = 1; i < ss.length; i++) {
      const s = ss[i], p = ss[i - 1];
      if (!s.kind || s.start - p.end >= 40) continue;
      const y1 = rowIndex.get(rowKey(p)) * ROW + ROW / 2, y2 = rowIndex.get(rowKey(s)) * ROW + ROW / 2;
      count[s.kind]++;
      if (y1 === y2) continue;
      const c = SWITCH[s.kind].color;
      lines += `<line x1="${pct(p.end)}%" y1="${y1}" x2="${pct(p.end)}%" y2="${y2}" stroke="${c}"/>`
             + `<line x1="${pct(p.end)}%" y1="${y2}" x2="${pct(s.start)}%" y2="${y2}" stroke="${c}"/>`;
    }

    const rowsHTML = rows.map(r => {
      if (r.type === 'theme') return `<div class="frow theme"><span>${r.name}</span><div class="ftrack"></div></div>`;
      const bars = ss.filter(s => rowKey(s) === r.id).map(s =>
        `<span class="fbar" data-open="${s.task.theme === 'etc' ? '' : s.task.id}" style="left:${pct(s.start)}%;width:${pct(s.end) - pct(s.start)}%" title="${esc(s.task.title)}\n${hm(s.start)}~${hm(s.end)}, ${fmt(s.end - s.start)}, ${esc(s.app)}${s.kind ? `\n${SWITCH[s.kind].name} 넘어옴` : ''}"></span>`).join('');
      return `<div class="frow task${r.etc ? ' etc' : ''}"><button type="button" class="flabel" ${r.etc ? 'disabled' : `data-open="${r.id}"`} title="${esc(r.title)}"><span class="dot"></span><span>${esc(r.title)}</span></button><div class="ftrack">${bars}</div></div>`;
    }).join('');

    const work = ss.filter(s => s.task.theme !== 'etc').reduce((a, s) => a + s.end - s.start, 0);
    const nTasks = new Set(ss.filter(s => s.task.theme !== 'etc').map(s => s.task.id)).size;
    const switches = count.planned + count.blocked + count.drift;
    const axis = `<div class="axis">${[8, 10, 12, 14, 16, 18, 20, 22, 24].map(h => `<span style="left:${pct(h * 60)}%">${String(h).padStart(2, '0')}</span>`).join('')}</div>`;
    const now = d === DAYS - 1 ? `<div class="nowline" style="left:calc(var(--lw) + (100% - var(--lw)) * ${pct(NOW_MIN) / 100})"><span>지금</span></div>` : '';

    $('main').innerHTML = `
      <header class="fhead">
        <h1>${date.getMonth() + 1}월 ${date.getDate()}일 ${WEEK[date.getDay()]}요일</h1>
        <p class="fsum">업무 ${nTasks}개, 작업 시간 ${fmt(work)}, 업무 전환 ${switches}번</p>
        <ul class="slegend">${Object.entries(SWITCH).map(([k, v]) => `<li style="color:${v.color}"><i></i><span style="color:var(--muted)">${v.name} ${count[k]}</span></li>`).join('')}</ul>
      </header>
      ${rows.length ? `<div class="flow">${axis}<div class="frows">${rowsHTML}<svg id="switches" height="${rows.length * ROW}">${lines}</svg>${now}</div></div>` : '<p class="empty-note">이 날은 기록이 없습니다</p>'}`;
    $('stats').textContent = `세션 ${ss.length}개, 업무 전환 ${switches}번`;
  }

  /* ---------- 연결망 ---------- */
  // 분류 순서(데모 분류 id 기준, 실제 데이터의 분류는 순서 지정 없이 뒤에 붙는다)
  const SKY_ORDER = ['cap', 'class', 'contest', 'job', 'media', 'etc'];
  const keyKind = (k, ts) => k.startsWith('t:') ? 'topic' : ts.some(t => t.out.includes(k.slice(2))) ? 'out' : 'ref';
  const wrap = (s, n = 9) => {
    const lines = [''];
    s.split(' ').forEach(w => {
      const cur = lines[lines.length - 1];
      if (cur && (cur + ' ' + w).length > n) lines.push(w); else lines[lines.length - 1] = cur ? cur + ' ' + w : w;
    });
    if (lines.length > 2) { lines.length = 2; lines[1] += '…'; }
    return lines;
  };
  const avg = (ns, p) => ns.reduce((a, n) => a + n[p], 0) / ns.length;

  /* ---------- 연결망: 앱(Sources/WorkGraphApp/Resources/graph/graph.js)과 같은 force-graph 그림 ---------- */
  const GRP = { Task: '#5e8fb3', Session: '#7f8ea3', ResourceRef: '#00929e', ResourceOut: '#b48f3c', App: '#915a95',
                Topic: '#5a9e6a', Problem: '#ab5242', Project: '#8f8884', LaterItem: '#6885c3' };
  const KIND_GRP = { ref: 'ResourceRef', out: 'ResourceOut', app: 'App', topic: 'Topic', problem: 'Problem', later: 'LaterItem' };
  const SW_RGB = { drift: '171,82,66', blocked: '180,143,60', planned: '127,142,163' };
  const LINK_DIST = { PART_OF: 34, TOUCHED: 48, USED: 62, ABOUT: 58, SWITCHED_TO: 70 };
  const skyPos = new Map();
  let sky = null;

  function skyOff() {
    if (!sky) return;
    sky.nodes.forEach(n => skyPos.set(n.id, { x: n.x, y: n.y }));
    sky.g._destructor?.();
    sky = null;
  }

  function skyData(pool) {
    const nodes = new Map(), links = [], ids = new Set(pool.map(t => t.id));
    const off = g => [...state.kindsOff].some(k => KIND_GRP[k] === g);
    const node = (id, group, title, extra) => { if (!nodes.has(id)) nodes.set(id, { id, group, title, ...extra }); return id; };
    const link = (source, target, type, kind) => links.push({ source, target, type, kind });

    const ses = new Map();                                       // SESSIONS 번호 -> 노드 id
    const byTask = new Map(pool.map(t => [t.id, []]));
    SESSIONS.forEach((s, i) => {
      if (!ids.has(s.task.id) || !inRange(s)) return;
      const id = node('ses:' + i, 'Session', `${md(s.d)} ${hm(s.start)}–${hm(s.end)}, ${s.app}`);
      ses.set(i, id);
      byTask.get(s.task.id).push({ id, s });
      link(id, 'task:' + s.task.id, 'PART_OF');
      if (!off('App')) { node('app:' + s.app, 'App', s.app); link(id, 'app:' + s.app, 'USED'); }
      if (s.kind && ses.has(i - 1)) link(ses.get(i - 1), id, 'SWITCHED_TO', s.kind);
    });

    pool.forEach(t => {
      const ts = byTask.get(t.id);
      node('task:' + t.id, 'Task', t.title, { tid: t.id, etc: t.theme === 'etc' });
      if (t.theme !== 'etc') { node('proj:' + t.theme, 'Project', THEME[t.theme].name); link('task:' + t.id, 'proj:' + t.theme, 'ON'); }
      const touch = (names, group) => !off(group) && names.forEach((name, i) => {
        node('res:' + name, group, name);
        link(ts[i % ts.length].id, 'res:' + name, 'TOUCHED');
      });
      touch(t.ref, 'ResourceRef'); touch(t.out, 'ResourceOut');
      if (!off('Topic')) t.topics.forEach(n => { node('topic:' + n, 'Topic', n); link('task:' + t.id, 'topic:' + n, 'ABOUT'); });
      if (!off('Problem')) t.problems.forEach(([n]) => { node('prob:' + t.id + n, 'Problem', n); link(ts[0].id, 'prob:' + t.id + n, 'HIT'); });
      if (!off('LaterItem')) t.later.forEach(n => { node('later:' + t.id + n, 'LaterItem', n); link('later:' + t.id + n, 'task:' + t.id, 'FOR'); });
    });

    const deg = new Map();
    links.forEach(l => { deg.set(l.source, (deg.get(l.source) || 0) + 1); deg.set(l.target, (deg.get(l.target) || 0) + 1); });
    const list = [...nodes.values()];
    list.forEach(n => { n.r = (n.group === 'Task' ? 5 : 2.6) + Math.sqrt(deg.get(n.id) || 0) * 1.35; Object.assign(n, skyPos.get(n.id)); });
    return { nodes: list, links };
  }

  function renderSky() {
    skyOff();
    const pool = visibleTasks().filter(t => state.showEtc || t.theme !== 'etc');
    const main = $('main');
    main.innerHTML = pool.length ? '<div id="skybox" aria-label="업무 연결망"></div>' : '<p class="empty-note">조건에 맞는 업무가 없습니다</p>';
    if (!pool.length) return;
    const data = skyData(pool), box = $('skybox');
    const S = { hover: null, nb: new Set(), didFit: false, nodes: data.nodes };
    const ends = l => [l.source.id ?? l.source, l.target.id ?? l.target];
    const lit = l => S.hover && ends(l).includes(S.hover.id);
    const alpha = n => !S.hover ? 1 : (n.id === S.hover.id || S.nb.has(n.id) ? 1 : 0.12);

    const g = ForceGraph()(box)
      .width(box.clientWidth).height(box.clientHeight)
      .backgroundColor('#ffffff').nodeId('id').nodeLabel(() => '')
      .nodeCanvasObject((n, ctx, k) => {
        const a = alpha(n), emph = S.hover && (n.id === S.hover.id || S.nb.has(n.id));
        ctx.globalAlpha = a;
        ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, 2 * Math.PI);
        ctx.fillStyle = n.etc ? '#9b9490' : GRP[n.group]; ctx.fill();
        const la = emph ? 1 : n.group === 'Task' ? Math.min(1, Math.max(0, (k - 0.45) / 0.3)) : Math.min(1, Math.max(0, (k - 1.5) / 0.7));
        if (la > 0.02 && a > 0.5) {
          ctx.font = `${n.group === 'Task' ? 600 : 400} ${(n.group === 'Task' ? 12 : 10.5) / k}px -apple-system, "Apple SD Gothic Neo", sans-serif`;
          ctx.textAlign = 'center'; ctx.textBaseline = 'top'; ctx.globalAlpha = a * la;
          ctx.fillStyle = emph ? '#24150f' : '#5f5753';
          ctx.fillText(n.title.length > 30 ? n.title.slice(0, 29) + '…' : n.title, n.x, n.y + n.r + 2.5 / k);
        }
        ctx.globalAlpha = 1;
      })
      .nodePointerAreaPaint((n, color, ctx) => { ctx.fillStyle = color; ctx.beginPath(); ctx.arc(n.x, n.y, n.r + 3, 0, 2 * Math.PI); ctx.fill(); })
      .linkColor(l => {
        if (l.type === 'SWITCHED_TO') return `rgba(${SW_RGB[l.kind] || SW_RGB.planned},${lit(l) ? 0.95 : S.hover ? 0.08 : 0.55})`;
        return lit(l) ? 'rgba(94, 143, 179, 0.75)' : S.hover ? 'rgba(36, 21, 15, 0.03)' : 'rgba(36, 21, 15, 0.11)';
      })
      .linkWidth(l => (lit(l) ? 1.6 : 0.7))
      .linkLineDash(l => (l.type === 'SWITCHED_TO' ? [4, 3] : null))
      .linkDirectionalArrowLength(l => (l.type === 'SWITCHED_TO' ? 5 : 0)).linkDirectionalArrowRelPos(1)
      .onNodeHover(n => {
        S.hover = n || null;
        S.nb = new Set();
        if (n) data.links.forEach(l => { const [a, b] = ends(l); if (a === n.id) S.nb.add(b); if (b === n.id) S.nb.add(a); });
        box.style.cursor = n && n.tid && !n.etc ? 'pointer' : 'default';
        g.linkColor(g.linkColor()).linkWidth(g.linkWidth());
      })
      .onNodeClick(n => { if (n.tid && !n.etc) openDetail(n.tid); })
      .onNodeDragEnd(n => { n.fx = n.x; n.fy = n.y; })
      .onEngineStop(() => { if (!S.didFit) { S.didFit = true; g.zoomToFit(500, 70); } })
      .cooldownTicks(240).d3VelocityDecay(0.35)
      .graphData(data);
    g.d3Force('charge').strength(-120).distanceMax(460);
    g.d3Force('link').distance(l => LINK_DIST[l.type] || 55);
    sky = { g, nodes: data.nodes, box };

    $('stats').textContent = `노드 ${data.nodes.length}개, 연결 ${data.links.length}개`;
    renderKinds(pool);
  }

  /* ---------- 시간 비중 ---------- */
  function squarify(items, x, y, w, h) {
    const out = [], total = items.reduce((a, i) => a + i.v, 0);
    if (!total || w <= 0 || h <= 0) return out;
    const rest = items.map(i => ({ ...i, a: (i.v * w * h) / total }));
    while (rest.length) {
      const side = Math.min(w, h);
      let row = [], worst = Infinity;
      while (rest.length) {
        const cand = row.concat(rest[0]), s = cand.reduce((a, i) => a + i.a, 0);
        const mx = Math.max(...cand.map(i => i.a)), mn = Math.min(...cand.map(i => i.a));
        const ws = Math.max((side * side * mx) / (s * s), (s * s) / (side * side * mn));
        if (ws > worst) break;
        row = cand; worst = ws; rest.shift();
      }
      const s = row.reduce((a, i) => a + i.a, 0);
      if (w >= h) {
        const rw = s / h; let yy = y;
        row.forEach(i => { const rh = i.a / rw; out.push({ ...i, x, y: yy, w: rw, h: rh }); yy += rh; });
        x += rw; w -= rw;
      } else {
        const rh = s / w; let xx = x;
        row.forEach(i => { const cw = i.a / rh; out.push({ ...i, x: xx, y, w: cw, h: rh }); xx += cw; });
        y += rh; h -= rh;
      }
    }
    return out;
  }

  function tileHTML(x) {
    const box = `left:${(x.x + 2).toFixed(1)}px;top:${(x.y + 2).toFixed(1)}px;width:${(x.w - 4).toFixed(1)}px;height:${(x.h - 4).toFixed(1)}px`;
    const tiny = x.w < 120 || x.h < 58 ? ' tiny' : '';
    if (!x.t) return `<div class="tile etc${tiny}" style="${box}" title="기타 업무 ${x.n}개, ${fmt(x.v)}"><h3>기타 업무 ${x.n}개</h3><p>${fmt(x.v)}, 업무 그래프에서 제외</p></div>`;
    const t = x.t, st = statsOf(t), etc = t.theme === 'etc';
    const rec = 1 - (DAYS - 1 - st.last.d) / (DAYS - 1);
    const mix = itemsOf(t).filter(([k, items]) => items.length && !state.kindsOff.has(k))
      .map(([k, items]) => `<i style="flex:${items.length};background:${KINDS[k].color}"></i>`).join('');
    const bg = etc ? '#dedad6' : `rgba(94, 143, 179, ${(0.16 + 0.55 * rec).toFixed(2)})`;
    return `<div class="tile${etc ? ' etc' : ''}${tiny}" style="${box};background:${bg}"${etc ? '' : ` data-open="${t.id}" tabindex="0"`} title="${esc(t.title)}, ${fmt(x.v)}, 세션 ${st.ss.length}개, 마지막 ${lastLabel(st.last)}">`
         + `<h3>${esc(t.title)}</h3><p>${fmt(x.v)}</p>${mix ? `<span class="mix">${mix}</span>` : ''}</div>`;
  }

  function renderTree() {
    const pool = visibleTasks();
    const main = $('main');
    const W = Math.max(720, main.clientWidth - 48), H = Math.max(460, main.clientHeight - 96);
    const groups = THEMES.map(th => {
      let ts = pool.filter(t => t.theme === th.id).map(t => ({ t, v: statsOf(t).mins })).filter(x => x.v > 0).sort((a, b) => b.v - a.v);
      if (th.id === 'etc' && !state.showEtc && ts.length) ts = [{ t: null, n: ts.length, v: ts.reduce((a, x) => a + x.v, 0) }];
      return { th, ts, v: ts.reduce((a, x) => a + x.v, 0) };
    }).filter(g => g.v > 0).sort((a, b) => b.v - a.v);
    const total = groups.reduce((a, g) => a + g.v, 0);
    let html = '';
    squarify(groups, 0, 0, W, H).forEach(g => {
      html += `<section class="tg" style="left:${g.x + 2}px;top:${g.y + 2}px;width:${g.w - 4}px;height:${g.h - 4}px"><header>${g.th.name}<span>${fmt(g.v)}, ${Math.round((g.v / total) * 100)}%</span></header></section>`;
      squarify(g.ts, g.x + 5, g.y + 31, g.w - 10, g.h - 36).forEach(x => { html += tileHTML(x); });
    });
    const rangeName = { today: '오늘', week: '최근 7일', all: `${md(0)} ~ ${md(DAYS - 1)}` }[state.range];
    $('main').innerHTML = groups.length ? `
      <header class="fhead">
        <h1>시간 비중</h1>
        <p class="fsum">${rangeName}, 작업 시간 ${fmt(total)}</p>
        <ul class="slegend"><li>칸 크기는 작업 시간</li><li><span class="ramp"></span>진할수록 최근</li><li><span class="mixkey"></span>아래 막대는 연결 정보 구성</li></ul>
      </header>
      <div class="treemap" style="width:${W}px;height:${H}px">${html}</div>` : `<p class="empty-note">조건에 맞는 업무가 없습니다</p>`;
    $('stats').textContent = `업무 ${pool.filter(t => t.theme !== 'etc').length}개, 작업 시간 ${fmt(total)}`;
    renderKinds(pool);
  }

  /* ---------- 달력 ---------- */
  function renderCal() {
    const tasks = TASKS.filter(t => !state.themesOff.has(t.theme) && matches(t) && SESSIONS.some(s => s.task === t));
    const days = [...Array(DAYS).keys()];
    const rows = [];
    THEMES.forEach(th => {
      const ts = tasks.filter(t => t.theme === th.id);
      if (!ts.length) return;
      rows.push({ name: th.name });
      if (th.id === 'etc' && !state.showEtc) rows.push({ title: `기타 업무 ${ts.length}개`, etc: true, set: ts });
      else ts.forEach(t => rows.push({ id: th.id === 'etc' ? null : t.id, title: t.title, etc: th.id === 'etc', set: [t] }));
    });
    let maxM = 1;
    rows.forEach(r => {
      if (!r.set) return;
      r.m = days.map(d => SESSIONS.filter(s => s.d === d && r.set.includes(s.task)).reduce((a, s) => a + s.end - s.start, 0));
      maxM = Math.max(maxM, ...r.m);
    });
    const dayTot = days.map(d => rows.reduce((a, r) => a + (r.m ? r.m[d] : 0), 0));
    const maxDay = Math.max(1, ...dayTot);
    const work = rows.filter(r => r.m && !r.etc).reduce((a, r) => a + r.m.reduce((x, y) => x + y, 0), 0);
    const best = dayTot.indexOf(Math.max(...dayTot));

    const head = `<span></span>${days.map(d => {
      const wd = dayDate(d).getDay();
      return `<span class="hd${wd === 0 || wd === 6 ? ' we' : ''}${d === DAYS - 1 ? ' today' : ''}">${md(d)}<br>${d === DAYS - 1 ? '오늘' : WEEK[wd]}</span>`;
    }).join('')}<span class="hd">합계</span>`;
    const body = rows.map(r => {
      if (!r.m) return `<div class="th">${r.name}</div>`;
      const cells = r.m.map((m, d) => {
        const td = d === DAYS - 1 ? ' td' : '';
        return m ? `<i class="hc on${r.etc ? ' grey' : ''}${td}" style="--a:${(0.15 + 0.85 * Math.sqrt(m / maxM)).toFixed(2)}" title="${md(d)} ${esc(r.title)} ${fmt(m)}"></i>`
                 : `<i class="hc${td}" title="${md(d)} 기록 없음"></i>`;
      }).join('');
      return `<button type="button" class="flabel${r.etc ? ' etc' : ''}" ${r.id ? `data-open="${r.id}"` : 'disabled'} title="${esc(r.title)}"><span class="dot"></span><span>${esc(r.title)}</span></button>${cells}<span class="tot">${fmt(r.m.reduce((a, b) => a + b, 0))}</span>`;
    }).join('');
    const foot = `<span class="flabel ft">하루 합계</span>${dayTot.map((m, d) => `<div class="dbar" title="${md(d)} ${fmt(m)}"><i style="height:${Math.round((m / maxDay) * 100)}%"></i></div>`).join('')}<span class="tot">${fmt(dayTot.reduce((a, b) => a + b, 0))}</span>`;

    $('main').innerHTML = rows.length ? `
      <header class="fhead">
        <h1>2주 기록</h1>
        <p class="fsum">${md(0)} ~ ${md(DAYS - 1)}, 작업 시간 ${fmt(work)}, 가장 많이 한 날 ${md(best)}</p>
        <ul class="slegend"><li>적음<span class="ramp"></span>많음</li></ul>
      </header>
      <div class="cal">${head}${body}${foot}</div>` : `<p class="empty-note">조건에 맞는 업무가 없습니다</p>`;
    $('stats').textContent = `업무 ${rows.filter(r => r.id).length}개, ${DAYS}일`;
  }

  /* ==== VIEW:ring+radial START ==== */
  const PI2 = Math.PI * 2;
  const polar = (cx, cy, r, a) => [cx + r * Math.sin(a), cy - r * Math.cos(a)];
  const f1 = n => n.toFixed(1);
  // 글자 폭 근사(한글 1em, 그 외 0.58em)로 말줄임
  const clip = (s, fs, max) => {
    let w = 0, out = '';
    for (const ch of s) { w += (ch.charCodeAt(0) > 255 ? 1 : 0.58) * fs; if (w > max) return out.replace(/\s+$/, '') + '…'; out += ch; }
    return s;
  };
  // 바깥쪽을 향하는 글씨 위치(각도 a, 반지름 r)
  const radialText = (cx, cy, r, a, text, cls, fs) => {
    const [x, y] = polar(cx, cy, r, a), deg = (a * 180) / Math.PI, right = Math.sin(a) >= 0;
    return `<text class="${cls}" font-size="${fs}" text-anchor="${right ? 'start' : 'end'}" dominant-baseline="central" transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(right ? deg - 90 : deg + 90)})">${esc(text)}</text>`;
  };
  const arcPath = (cx, cy, r, a0, a1) => {
    const [x0, y0] = polar(cx, cy, r, a0), [x1, y1] = polar(cx, cy, r, a1);
    return `M${f1(x0)} ${f1(y0)}A${r} ${r} 0 ${a1 - a0 > Math.PI ? 1 : 0} 1 ${f1(x1)} ${f1(y1)}`;
  };
  // 마우스를 올린 점과 연결된 것만 진하게. map: id -> {nodes, links, labs}
  function hoverWire(svg, map, onChange) {
    const ns = [...svg.querySelectorAll('[data-n]')], ls = [...svg.querySelectorAll('[data-l]')];
    const set = id => {
      const m = id && map.get(id);
      svg.classList.toggle('hov', !!m);
      ns.forEach(e => { e.classList.toggle('on', !!m && m.nodes.has(e.dataset.n)); e.classList.toggle('lab', !!m && m.labs.has(e.dataset.n)); });
      ls.forEach(e => e.classList.toggle('on', !!m && m.links.has(e.dataset.l)));
      onChange?.(id);
    };
    svg.addEventListener('mouseover', e => { const n = e.target.closest('[data-n]'); set(n ? n.dataset.n : null); });
    svg.addEventListener('mouseleave', () => set(null));
    svg.addEventListener('focusin', e => { const n = e.target.closest('[data-n]'); if (n) set(n.dataset.n); });
    svg.addEventListener('focusout', () => set(null));
  }
  const addTo = (map, id, nodes, links, labs) => {
    if (!map.has(id)) map.set(id, { nodes: new Set([id]), links: new Set(), labs: new Set() });
    const m = map.get(id); nodes.forEach(x => m.nodes.add(x)); links.forEach(x => m.links.add(x)); labs.forEach(x => m.labs.add(x));
  };
  const rvSize = () => {
    const m = $('main');
    return [Math.max(720, m.clientWidth - 48), Math.max(500, m.clientHeight - 112)];
  };
  const rvEmpty = () => { $('main').innerHTML = '<p class="empty-note">조건에 맞는 업무가 없습니다</p>'; $('stats').textContent = '업무 0개'; renderKinds([]); };

  /* ---------- 원형 연결 ---------- */
  function renderRing() {
    const pool = visibleTasks().filter(t => state.showEtc || t.theme !== 'etc');
    if (!pool.length) return rvEmpty();
    const tasks = THEMES.flatMap(th => pool.filter(t => t.theme === th.id));
    const items = new Map();                                   // 'kind|이름' -> {id, k, name, ts}
    tasks.forEach(t => itemsOf(t).forEach(([k, list]) => {
      if (state.kindsOff.has(k)) return;
      list.forEach(name => {
        const id = 'i:' + k + '|' + name;
        if (!items.has(id)) items.set(id, { id, k, name, ts: [] });
        items.get(id).ts.push(t);
      });
    }));
    const groups = [{ key: 'task', name: '업무', color: '#5e8fb3', w: 1.5, list: tasks.map(t => ({ id: 't:' + t.id, t, name: t.title })) }];
    Object.keys(KINDS).forEach(k => {
      const list = [...items.values()].filter(i => i.k === k);
      if (list.length) groups.push({ key: k, name: KINDS[k].name, color: KINDS[k].color, w: 1, list });
    });
    const [W, H] = rvSize(), cx = W / 2, cy = H / 2;
    const R = Math.max(150, Math.min(W, H) / 2 - 150), GAP = 0.07;
    const slots = groups.reduce((a, g) => a + g.w * g.list.length, 0), unit = (PI2 - GAP * groups.length) / slots;
    const pos = new Map();                                     // 노드 id -> 각도
    let a = GAP / 2, bands = '', names = '', nodes = '';
    const rIn = R - 6;
    groups.forEach(g => {
      const a0 = a, step = g.w * unit;
      g.list.forEach((n, i) => pos.set(n.id, a0 + (i + 0.5) * step));
      a += step * g.list.length;
      bands += `<path d="${arcPath(cx, cy, R + 9, a0, a)}" stroke="${g.color}" stroke-width="6" fill="none"/>`;
      const [nx, ny] = polar(cx, cy, R - 26, (a0 + a) / 2);
      names += `<text class="rname" x="${f1(nx)}" y="${f1(ny)}" fill="${g.color}" text-anchor="middle" dominant-baseline="central" font-size="12">${g.name}</text>`;
      a += GAP;
    });
    let links = '';
    const map = new Map();
    tasks.forEach(t => itemsOf(t).forEach(([k, list]) => {
      if (state.kindsOff.has(k)) return;
      list.forEach(name => {
        const iid = 'i:' + k + '|' + name, tid = 't:' + t.id, lid = tid + '>' + iid;
        const [x0, y0] = polar(cx, cy, rIn, pos.get(tid)), [x1, y1] = polar(cx, cy, rIn, pos.get(iid));
        const qx = cx + ((x0 + x1) / 2 - cx) * 0.2, qy = cy + ((y0 + y1) / 2 - cy) * 0.2;
        links += `<path class="rlk" data-l="${esc(lid)}" d="M${f1(x0)} ${f1(y0)}Q${f1(qx)} ${f1(qy)} ${f1(x1)} ${f1(y1)}" stroke="${KINDS[k].color}"/>`;
        addTo(map, tid, [iid], [lid], [iid]); addTo(map, iid, [tid], [lid], [tid]);
      });
    }));
    // 항목에 마우스를 올리면 같은 항목을 쓰는 모든 업무를 켠다(위 addTo가 이미 처리)
    const dot = (id, r, color, label, fs, extra, title) => {
      const [x, y] = polar(cx, cy, rIn, pos.get(id));
      return `<g class="rn" data-n="${esc(id)}"${extra}><title>${esc(title)}</title><circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r)}" fill="${color}"/>${radialText(cx, cy, R + 20, pos.get(id), clip(label, fs, 128), 'rl', fs)}</g>`;
    };
    groups.forEach(g => g.list.forEach(n => {
      if (n.t) nodes += dot(n.id, 5, g.color, n.name, 11.5, ` data-open="${n.t.id}" tabindex="0"`, `${n.name}, ${fmt(statsOf(n.t).mins)}, ${THEME[n.t.theme].name}`);
      else nodes += dot(n.id, Math.min(7, 3.2 + 1.3 * (n.ts.length - 1)), g.color, n.name, 10.5, '', n.ts.length > 1 ? `${n.name}, 업무 ${n.ts.length}개가 함께 사용` : n.name);
    }));
    const ticks = [R, R * 0.66, R * 0.33].map(r => `<circle cx="${cx}" cy="${cy}" r="${f1(r)}" class="rguide"/>`).join('');
    const shared = [...items.values()].filter(i => i.ts.length > 1).length;
    $('main').innerHTML = `
      <header class="fhead">
        <h1>원형 연결</h1>
        <p class="fsum">업무 ${tasks.length}개, 항목 ${items.size}개, 여러 업무가 함께 쓴 항목 ${shared}개</p>
        <ul class="slegend"><li>곡선은 업무와 항목의 연결</li><li>큰 점은 여러 업무가 함께 쓴 항목</li></ul>
      </header>
      <svg class="rv" id="ring" width="${W}" height="${H}" aria-label="원형 연결">${ticks}${links}${bands}${names}${nodes}</svg>`;
    hoverWire($('ring'), map);
    $('stats').textContent = `업무 ${tasks.length}개, 항목 ${items.size}개`;
    renderKinds(pool);
  }

  /* ---------- 방사형 트리 ---------- */
  function renderRadial() {
    const pool = visibleTasks().filter(t => state.showEtc || t.theme !== 'etc');
    const hubs = THEMES.map(th => ({
      th, ts: pool.filter(t => t.theme === th.id).map(t => ({
        t, mins: statsOf(t).mins, its: itemsOf(t).filter(([k]) => !state.kindsOff.has(k)).flatMap(([k, list]) => list.map(name => ({ k, name }))),
      })),
    })).filter(h => h.ts.length);
    if (!hubs.length) return rvEmpty();
    hubs.forEach(h => { h.ts.forEach(x => { x.w = Math.max(1.5, x.its.length); }); h.w = h.ts.reduce((s, x) => s + x.w, 0); h.mins = h.ts.reduce((s, x) => s + x.mins, 0); });
    const total = hubs.reduce((s, h) => s + h.mins, 0), maxM = Math.max(...hubs.flatMap(h => h.ts.map(x => x.mins)));
    const [W, H] = rvSize(), cx = W / 2, cy = H / 2;
    const R3 = Math.max(170, Math.min(W, H) / 2 - 150), R1 = R3 * 0.44, R2 = R3 * 0.74, GAP = 0.08;
    const unit = (PI2 - GAP * hubs.length) / hubs.reduce((s, h) => s + h.w, 0);
    const keyId = it => it.k + '|' + it.name;
    const twin = new Map();                                    // 항목 키 -> 노드 id 목록
    let a = GAP / 2, lines = '', twins = '', nodes = '', hubTxt = '';
    const map = new Map();
    const seg = (x0, y0, x1, y1, cls, extra = '') => `<line class="${cls}" x1="${f1(x0)}" y1="${f1(y0)}" x2="${f1(x1)}" y2="${f1(y1)}"${extra}/>`;
    hubs.forEach(h => {
      const h0 = a, ha = h0 + (h.w * unit) / 2, hid = 'h:' + h.th.id, [hx, hy] = polar(cx, cy, R1, ha);
      lines += seg(cx, cy, hx, hy, 'wl');
      let b = h0;
      h.ts.forEach(x => {
        const w = x.w * unit, ta = b + w / 2, tid = 't:' + x.t.id, [tx, ty] = polar(cx, cy, R2, ta);
        lines += seg(hx, hy, tx, ty, 'wl');
        const labs = [], lks = [];
        x.its.forEach((it, i) => {
          const ia = b + ((i + 0.5) / x.its.length) * w, iid = `i:${x.t.id}:${keyId(it)}`, [ix, iy] = polar(cx, cy, R3, ia), lid = tid + '>' + iid;
          lines += seg(tx, ty, ix, iy, 'wl sp', ` data-l="${esc(lid)}" stroke="${KINDS[it.k].color}"`);
          // 이름은 점 위치와 별개로 13.5px 간격으로 펼쳐 겹치지 않게 하고, 가는 선으로 점과 잇는다
          const la = ta + (i - (x.its.length - 1) / 2) * (13.5 / (R3 + 12)), [lx, ly] = polar(cx, cy, R3 + 9, la);
          nodes += `<g class="rn il" data-n="${esc(iid)}"><title>${esc(it.name)}</title><line class="ld" x1="${f1(ix)}" y1="${f1(iy)}" x2="${f1(lx)}" y2="${f1(ly)}"/><circle cx="${f1(ix)}" cy="${f1(iy)}" r="3.6" fill="${KINDS[it.k].color}"/>${radialText(cx, cy, R3 + 12, la, clip(it.name, 10.5, 128), 'rl', 10.5)}</g>`;
          const key = keyId(it);
          if (!twin.has(key)) twin.set(key, []);
          twin.get(key).push({ iid, ia, ix, iy });
          labs.push(iid); lks.push(lid);
          addTo(map, iid, [tid], [lid], [iid]);
        });
        const r = 3 + Math.sqrt(x.mins / maxM) * 8;
        nodes += `<g class="rn" data-n="${esc(tid)}" data-open="${x.t.id}" tabindex="0"><title>${esc(x.t.title)}, ${fmt(x.mins)}</title><circle cx="${f1(tx)}" cy="${f1(ty)}" r="${f1(r)}" class="tk"/>${radialText(cx, cy, R3 + 12, ta, clip(x.t.title, 11.5, 128), 'rl tl', 11.5)}</g>`;
        addTo(map, tid, x.its.map((_, i) => `i:${x.t.id}:${keyId(x.its[i])}`), lks, labs);
        x.tid = tid; x.hid = hid;
        b += w;
      });
      const hr = 5 + Math.sqrt(h.mins / total) * 16;
      nodes += `<g class="rn" data-n="${esc(hid)}"><title>${esc(h.th.name)}, ${fmt(h.mins)}</title><circle cx="${f1(hx)}" cy="${f1(hy)}" r="${f1(hr)}" class="hk"/></g>`;
      hubTxt += `<text class="hl" x="${f1(hx)}" y="${f1(hy - hr - 8)}" text-anchor="middle" font-size="11.5">${esc(h.th.name)}</text>`;
      a = h0 + h.w * unit + GAP;
    });
    // 같은 항목끼리 잇는 점선(여러 업무가 함께 쓴 항목)
    twin.forEach((list, key) => {
      if (list.length < 2) return;
      for (let i = 1; i < list.length; i++) {
        const p = list[0], q = list[i], lid = 'tw:' + key + ':' + i;
        const qx = cx + ((p.ix + q.ix) / 2 - cx) * 0.25, qy = cy + ((p.iy + q.iy) / 2 - cy) * 0.25;
        twins += `<path class="twl" data-l="${esc(lid)}" d="M${f1(p.ix)} ${f1(p.iy)}Q${f1(qx)} ${f1(qy)} ${f1(q.ix)} ${f1(q.iy)}"/>`;
        list.forEach(n => { addTo(map, n.iid, list.map(o => o.iid), [lid], list.map(o => o.iid)); });
      }
    });
    // 업무에 올리면 그 항목의 점선도 함께 켠다
    hubs.forEach(h => h.ts.forEach(x => x.its.forEach(it => {
      const m = map.get(`i:${x.t.id}:${keyId(it)}`), t = map.get(x.tid);
      m.links.forEach(l => { if (l.startsWith('tw:')) t.links.add(l); });
      twin.get(keyId(it)).forEach(o => t.nodes.add(o.iid));
    })));
    const rangeName = { today: '오늘', week: '최근 7일', all: `${md(0)} ~ ${md(DAYS - 1)}` }[state.range];
    $('main').innerHTML = `
      <header class="fhead">
        <h1>방사형 트리</h1>
        <p class="fsum">${rangeName}, 작업 시간 ${fmt(total)}</p>
        <ul class="slegend"><li>가운데 전체, 바깥으로 상위 분류, 업무, 항목</li><li>업무 점 크기는 작업 시간</li><li>점선은 같은 항목</li></ul>
      </header>
      <svg class="rv" id="radial" width="${W}" height="${H}" aria-label="방사형 트리">${lines}${twins}${nodes}
        <circle cx="${cx}" cy="${cy}" r="38" class="ck"/>
        <text class="c1" x="${cx}" y="${cy - 7}" text-anchor="middle" font-size="11">전체</text>
        <text class="c2" x="${cx}" y="${cy + 9}" text-anchor="middle" font-size="10.5">${fmt(total)}</text>${hubTxt}</svg>`;
    const c1 = $('radial').querySelector('.c1'), c2 = $('radial').querySelector('.c2');
    hoverWire($('radial'), map, id => {
      const x = id && hubs.flatMap(h => h.ts).find(o => o.tid === id);
      $('radial').classList.toggle('ht', !!x);
      c1.textContent = x ? clip(x.t.title, 11, 66) : '전체';
      c2.textContent = x ? fmt(x.mins) : fmt(total);
    });
    $('stats').textContent = `업무 ${pool.filter(t => t.theme !== 'etc').length}개, 작업 시간 ${fmt(total)}`;
    renderKinds(pool);
  }
  /* ==== VIEW:ring+radial END ==== */

  /* ==== VIEW:path+gantt START ==== */
  // 두 보기 공용: 보이는 세션에서 업무 줄 목록을 상위 분류 순서로 만든다
  function pgRows(ss) {
    const rows = [];
    THEMES.forEach(th => {
      if (state.themesOff.has(th.id)) return;
      const ts = TASKS.filter(t => t.theme === th.id && matches(t) && ss.some(s => s.task === t));
      if (!ts.length) return;
      if (th.id === 'etc' && !state.showEtc) rows.push({ id: 'etc', th, title: `기타 업무 ${ts.length}개`, etc: true, set: ts });
      else ts.forEach(t => rows.push({ id: t.id, th, title: t.title, etc: th.id === 'etc', set: [t] }));
    });
    rows.forEach((r, i) => r.i = i);
    return rows;
  }
  const pgIdx = rows => { const m = new Map(); rows.forEach(r => r.set.forEach(t => m.set(t, r.i))); return m; };
  const pgMins = (r, f) => SESSIONS.filter(s => r.set.includes(s.task) && f(s)).reduce((a, s) => a + s.end - s.start, 0);

  /* ---------- 전환 경로 ---------- */
  function renderPath() {
    const d = state.day, date = dayDate(d);
    $('dayLabel').textContent = `${md(d)} (${WEEK[date.getDay()]})`;
    $('prevDay').disabled = d === 0;
    $('nextDay').disabled = d === DAYS - 1;
    const ss = SESSIONS.filter(s => s.d === d && !state.themesOff.has(s.task.theme) && matches(s.task)).sort((a, b) => a.start - b.start);
    const rows = pgRows(ss), idx = pgIdx(rows), ROW = 44;
    const mid = s => Math.min(100, Math.max(0, pct((s.start + s.end) / 2)));
    const count = { planned: 0, blocked: 0, drift: 0 };
    let segs = '';
    for (let i = 1; i < ss.length; i++) {
      const p = ss[i - 1], s = ss[i];
      if (s.kind) count[s.kind]++;
      const c = s.kind === 'blocked' || s.kind === 'drift' ? SWITCH[s.kind].color : 'var(--accent)';
      segs += `<line x1="${mid(p)}%" y1="${idx.get(p.task) * ROW + ROW / 2}" x2="${mid(s)}%" y2="${idx.get(s.task) * ROW + ROW / 2}" stroke="${c}"/>`;
    }
    const H = rows.length * ROW;
    const band = `<svg class="pband" height="${H}"><defs><filter id="pblur" filterUnits="userSpaceOnUse" x="-20" y="-20" width="4000" height="${H + 40}"><feGaussianBlur stdDeviation="6"/></filter></defs>`
      + `<g class="pthick" filter="url(#pblur)">${segs}</g><g class="pthin">${segs}</g></svg>`;
    const rowsHTML = rows.map(r => {
      const mine = ss.filter(s => r.set.includes(s.task));
      const dots = mine.map(s => {
        const sz = Math.round(Math.min(26, 8 + (s.end - s.start) / 5));
        return `<span class="pdot" style="left:${mid(s)}%;width:${sz}px;height:${sz}px" data-tip="${esc(s.task.title)}|${hm(s.start)}~${hm(s.end)}, ${fmt(s.end - s.start)}|${esc(s.app)}"></span>`;
      }).join('');
      return `<div class="prow${r.etc ? ' etc' : ''}"><button type="button" class="plab" ${r.etc ? 'disabled' : `data-open="${r.id}"`} title="${esc(r.title)}"><span>${esc(r.title)}</span></button>`
        + `<div class="ptrack">${dots}</div><span class="ptot">${fmt(mine.reduce((a, s) => a + s.end - s.start, 0))}</span></div>`;
    }).join('');
    const work = ss.filter(s => s.task.theme !== 'etc').reduce((a, s) => a + s.end - s.start, 0);
    const sw = count.planned + count.blocked + count.drift;
    const axis = `<div class="axis">${[8, 10, 12, 14, 16, 18, 20, 22, 24].map(h => `<span style="left:${pct(h * 60)}%">${String(h).padStart(2, '0')}</span>`).join('')}</div>`;
    $('main').innerHTML = `
      <header class="fhead">
        <h1>${date.getMonth() + 1}월 ${date.getDate()}일 ${WEEK[date.getDay()]}요일 전환 경로</h1>
        <p class="fsum">작업 시간 ${fmt(work)}, 업무 전환 ${sw}번</p>
        <ul class="slegend">${Object.entries(SWITCH).map(([k, v]) => `<li style="color:${k === 'planned' ? 'var(--accent)' : v.color}"><i style="border-top-style:solid"></i><span style="color:var(--muted)">${v.name} ${count[k]}</span></li>`).join('')}</ul>
      </header>
      ${rows.length ? `<div class="pwrap">${axis}<div class="prows">${rowsHTML}${band}</div><div class="ptip" hidden></div></div>` : '<p class="empty-note">이 날은 기록이 없습니다</p>'}`;
    $('stats').textContent = `세션 ${ss.length}개, 업무 전환 ${sw}번`;
  }
  $('main').addEventListener('mousemove', e => {
    const tip = document.querySelector('.ptip'); if (!tip) return;
    const dot = e.target.closest('.pdot');
    tip.hidden = !dot;
    if (!dot) return;
    const [a, b, c] = dot.dataset.tip.split('|');
    tip.innerHTML = `<strong>${a}</strong><br>${b}<br>${c}`;
    const w = tip.parentNode.getBoundingClientRect();
    tip.style.left = Math.min(e.clientX - w.left + 12, w.width - tip.offsetWidth) + 'px';
    tip.style.top = (e.clientY - w.top + 14) + 'px';
  });

  /* ---------- 간트 ---------- */
  let gctx = null;
  function renderGantt() {
    const d0 = state.range === 'today' ? DAYS - 1 : state.range === 'week' ? DAYS - 7 : 0, n = DAYS - d0;
    const ss = SESSIONS.filter(s => s.d >= d0 && !state.themesOff.has(s.task.theme) && matches(s.task)).sort((a, b) => a.d - b.d || a.start - b.start);
    const rows = pgRows(ss), idx = pgIdx(rows);
    rows.forEach(r => {

    const svg = $('sbSvg'), g = $('sbG'), tip = $('sbTip');

    const sector = (r0, r1, a0, a1, i0, i1) => {   // 안쪽 둘레와 바깥 둘레에서 같은 픽셀 간격(2px)이 나오도록 각도를 따로 줄인다
      const s0 = a0 + i0 / r0, e0 = a1 - i1 / r0, s1 = a0 + i0 / r1, e1 = a1 - i1 / r1;
      if (e1 - s1 <= 0.0005) return '';
      const [p, q] = polar(cx, cy, r1, s1), [p2, q2] = polar(cx, cy, r1, e1), [p3, q3] = polar(cx, cy, r0, e0), [p4, q4] = polar(cx, cy, r0, s0);
      const big = e1 - s1 > Math.PI ? 1 : 0;
      return `M${f1(p)} ${f1(q)}A${f1(r1)} ${f1(r1)} 0 ${big} 1 ${f1(p2)} ${f1(q2)}L${f1(p3)} ${f1(q3)}A${f1(r0)} ${f1(r0)} 0 ${big} 0 ${f1(p4)} ${f1(q4)}Z`;
    };
    const draw = m => {
      let s = '', t = '';
      arcs.forEach(A => {
        const [a0, a1] = m.get(A.id), [r0, r1] = rr[A.ring];
        const i0 = A.ring === 2 ? ((A.ins & 1) ? 1 : 0) : 1, i1 = A.ring === 2 ? ((A.ins & 2) ? 1 : 0) : 1;
        const d = sector(r0, r1, a0, a1, i0, i1);
        if (!d) return;
        s += `<path class="sb-a${sb.sel && A.tk === sb.sel && A.ring === 1 ? ' sb-sel' : ''}" d="${d}" fill="${A.color}" fill-opacity="${A.op}" data-ring="${A.ring}" data-th="${A.th}" data-tk="${A.tk}" data-k="${A.k}"/>`;
        if (A.ring === 0) {
          const am = (a0 + a1) / 2, rm = (r0 + r1) / 2, len = (a1 - a0) * rm - 12;
          if (len >= 36) {
            const [x, y] = polar(cx, cy, rm, am), deg = (am * 180) / Math.PI;
            t += `<text class="sb-nm" font-size="12" text-anchor="middle" dominant-baseline="central" transform="translate(${f1(x)} ${f1(y)}) rotate(${f1(Math.cos(am) >= 0 ? deg : deg - 180)})">${esc(clip(A.name, 12, len))}</text>`;
          }
        }
      });
      const zg = sb.zoom ? groups.find(x => x.th.id === sb.zoom) : null;
      g.innerHTML = s + t + `<circle class="sb-ctr${zg ? ' sb-back' : ''}" cx="${cx}" cy="${cy}" r="${f1(rc)}"/>`
        + `<text class="sb-c1" x="${cx}" y="${cy - 5}" text-anchor="middle" font-size="13">${esc(zg ? clip(zg.th.name, 13, rc * 1.7) : '전체')}</text>`
        + `<text class="sb-c2" x="${cx}" y="${cy + 12}" text-anchor="middle" font-size="12">${fmt(zg ? zg.mins : total)}</text>`;
    };
    draw(cur);

    const go = to => {
      const from = cur;
      cur = to;
      if (matchMedia('(prefers-reduced-motion: reduce)').matches) { draw(to); return; }
      busy = true; tip.hidden = true;
      const t0 = performance.now();
      const step = now => {
        const k = Math.min(1, (now - t0) / 300), e = 1 - Math.pow(1 - k, 3), m = new Map();
        to.forEach((v, id) => { const f = from.get(id); m.set(id, [f[0] + (v[0] - f[0]) * e, f[1] + (v[1] - f[1]) * e]); });
        draw(m);
        if (k < 1) sb.anim = requestAnimationFrame(step); else busy = false;
      };
      sb.anim = requestAnimationFrame(step);
    };

    const hover = a => {
      svg.classList.toggle('sb-hov', !!a);
      svg.querySelectorAll('.sb-a').forEach(e => {
        const on = !!a && (a.dataset.ring === '0' ? e.dataset.th === a.dataset.th : e.dataset.tk === a.dataset.tk);
        e.classList.toggle('sb-on', on); e.classList.toggle('sb-hit', e === a);
      });
    };
    const pctOf = m => { const p = (m / total) * 100; return p < 1 ? '1% 미만' : `${Math.round(p)}%`; };
    const tipHTML = a => {
      const ring = +a.dataset.ring, g0 = groups.find(x => x.th.id === a.dataset.th), r = rowOf.get(a.dataset.tk);
      if (ring === 0) {
        return `<p class="sb-tc">상위 분류</p><h4 class="sb-tt">${esc(g0.th.name)}</h4>
          <p>${fmt(g0.mins)}, 전체의 ${pctOf(g0.mins)}</p><p>업무 ${g0.rs.length}개</p>
          <ol class="sb-tl">${g0.rs.slice(0, 3).map(x => `<li><span>${esc(x.t.title)}</span><b>${fmt(x.mins)}</b></li>`).join('')}</ol>
          ${sb.zoom ? '' : '<p class="sb-hint">눌러서 이 분류만 확대</p>'}`;
      }
      if (ring === 2) {
        const k = a.dataset.k, list = itemsOf(r.t).find(([kk]) => kk === k)[1];
        return `<p class="sb-tc">${esc(g0.th.name)}, ${esc(r.t.title)}</p><h4 class="sb-tt"><i class="sb-dot" style="background:${KINDS[k].color}"></i>${KINDS[k].name} ${list.length}개</h4>
          <ol class="sb-tl">${list.slice(0, 5).map(n => `<li><span>${esc(n)}</span></li>`).join('')}</ol>${list.length > 5 ? `<p class="sb-hint">외 ${list.length - 5}개</p>` : ''}`;
      }
      const st = statsOf(r.t);
      return `<p class="sb-tc">${esc(g0.th.name)}</p><h4 class="sb-tt">${esc(r.t.title)}</h4>
        <p>${fmt(r.mins)}, 전체의 ${pctOf(r.mins)}</p><p>세션 ${st.ss.length}개, 마지막 활동 ${lastLabel(st.last)}</p>
        <ol class="sb-tl">${sbTopItems(r.t, 3).map(n => `<li><span>${esc(n)}</span></li>`).join('')}</ol><p class="sb-hint">눌러서 자세히 보기</p>`;
    };
    const place = e => {
      const w = tip.offsetWidth, h = tip.offsetHeight;
      tip.style.left = Math.max(8, Math.min(innerWidth - w - 8, e.clientX + 16)) + 'px';
      tip.style.top = Math.max(8, Math.min(innerHeight - h - 8, e.clientY + 16)) + 'px';
    };
    svg.addEventListener('mouseover', e => {
      if (busy) return;
      const a = e.target.closest('.sb-a');
      hover(a);
      if (!a) { tip.hidden = true; return; }
      tip.innerHTML = tipHTML(a); tip.hidden = false; place(e);
    });
    svg.addEventListener('mousemove', e => { if (!tip.hidden) place(e); });
    svg.addEventListener('mouseleave', () => { hover(null); tip.hidden = true; });
    svg.addEventListener('click', e => {
      if (busy) return;
      if (e.target.closest('.sb-ctr') && sb.zoom) { sb.zoom = null; hover(null); go(lay(null, fm)); return; }
      const a = e.target.closest('.sb-a'); if (!a) return;
      if (a.dataset.ring === '0') { if (!sb.zoom) { sb.zoom = a.dataset.th; hover(null); go(lay(sb.zoom, fm)); } return; }
      sb.sel = a.dataset.tk;
      selectTask(sb.sel);
      renderSunburst();
    });
    const panel = $('sbPanel');
    if (panel) panel.addEventListener('click', e => { if (e.target.closest('[data-sbact="close"]')) { sb.sel = null; renderSunburst(); } });

    $('stats').textContent = `업무 ${pool.length}개, 작업 시간 ${fmt(total)}`;
    renderKinds(pool);
  }
  // 종류 순서대로 주요 자료 이름 n개
  function sbTopItems(t, n) {
    const order = ['out', 'ref', 'topic', 'app', 'problem', 'later'], by = Object.fromEntries(itemsOf(t).map(x => [x[0], x[1]]));
    return order.filter(k => !state.kindsOff.has(k)).flatMap(k => by[k]).slice(0, n);
  }
  function sbPanelHTML(t, pool, total) {
    const st = statsOf(t), th = THEME[t.theme];
    const share = new Map();
    pool.forEach(o => keysOf(o).forEach(k => share.set(k, (share.get(k) || 0) + 1)));
    const rowsHTML = itemsOf(t).filter(([k, l]) => l.length && !state.kindsOff.has(k)).map(([k, l, pre]) => {
      const sorted = pre ? [...l].sort((a, b) => (share.get(pre + b) || 0) - (share.get(pre + a) || 0)) : l;
      return `<div class="sb-kr"><dt><i class="sb-dot" style="background:${KINDS[k].color}"></i>${KINDS[k].name}</dt><dd>${sorted.slice(0, 3).map(n => `<span>${esc(n)}${pre && share.get(pre + n) > 1 ? '<em>함께 사용</em>' : ''}</span>`).join('')}${l.length > 3 ? `<span class="sb-more">외 ${l.length - 3}개</span>` : ''}</dd></div>`;
    }).join('');
    const day = Array.from({ length: 7 }, (_, i) => SESSIONS.filter(s => s.task === t && s.d === DAYS - 7 + i).reduce((a, s) => a + s.end - s.start, 0));
    const mx = Math.max(1, ...day);
    const bars = day.map((m, i) => `<i style="height:${m ? Math.max(8, Math.round((m / mx) * 100)) : 4}%" class="${m ? '' : 'sb-none'}" title="${md(DAYS - 7 + i)} ${m ? fmt(m) : '기록 없음'}"></i>`).join('');
    const recent = st.ss.slice(-3).reverse().map(s => `<li><span>${md(s.d)} ${hm(s.start)}</span><b>${fmt(s.end - s.start)}</b>${s.app ? `<em>${esc(s.app)}</em>` : ''}</li>`).join('');
    return `<p class="sb-tc" style="color:${th.color}">${esc(th.name)}</p><h3 class="sb-pt">${esc(t.title)}</h3>
      ${t.sum ? `<p class="sb-ps">${esc(t.sum)}</p>` : ''}
      <dl class="sb-num"><div><dt>작업 시간</dt><dd>${fmt(st.mins)}</dd></div><div><dt>세션</dt><dd>${st.ss.length}개</dd></div><div><dt>마지막 활동</dt><dd>${lastLabel(st.last)}</dd></div><div><dt>처음 기록</dt><dd>${st.first ? md(st.first.d) : '-'}</dd></div></dl>
      <h4 class="sb-ph">최근 7일</h4><div class="sb-week">${bars}</div><p class="sb-wl"><span>${md(DAYS - 7)}</span><span>${md(DAYS - 1)}</span></p>
      ${rowsHTML ? `<h4 class="sb-ph">자료</h4><dl class="sb-krs">${rowsHTML}</dl>` : ''}
      ${recent ? `<h4 class="sb-ph">최근 세션</h4><ul class="sb-rs">${recent}</ul>` : ''}
      <div class="sb-btns"><button type="button" class="sb-go" data-open="${t.id}">자세히</button><button type="button" class="sb-x" data-sbact="close">닫기</button></div>`;
  }
  /* ==== VIEW:sunburst END ==== */

  /* ---------- 오른쪽 NODE DETAIL (Figma GR-01~07) ---------- */
  const ARROW = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>';
  function selectTask(id) { if (!TASK[id]) return; state.sel = id; renderNode(); }

      <div class="ndiv"></div><p class="eyebrow">CONNECTIONS</p>${conns || '<p class="empty">연결된 항목이 없습니다</p>'}`;

  /* ---------- 왼쪽 패널 ---------- */
  function renderThemes() {
    $('themes').innerHTML = THEMES.map(th => {
      const n = TASKS.filter(t => t.theme === th.id && statsOf(t).ss.length).length;
      return `<li><button type="button" data-theme="${th.id}" class="${state.themesOff.has(th.id) ? 'off' : ''}"><span class="dot ring"></span>${th.name}<span class="count">${n}</span></button></li>`;
    }).join('');
  }
  function renderKinds(pool) {
    const uniq = k => new Set(pool.filter(t => t.theme !== 'etc').flatMap(t => itemsOf(t).find(([kk]) => kk === k)[1])).size;
    $('kinds').innerHTML = Object.entries(KINDS).map(([k, v]) =>
      `<li><button type="button" data-kind="${k}" class="${state.kindsOff.has(k) ? 'off' : ''}"><span class="dot" style="background:${v.color}"></span>${v.name}<span class="count">${uniq(k)}</span></button></li>`).join('');
  }

  const FULL = new Set(['sky']);   // 왼쪽 여백 없이 캔버스를 꽉 채우는 보기
  function render() {
    hot = null;

  const openDetail = id => { if (!id || !TASK[id]) return; state.detail = id; render(); };

  $('main').addEventListener('mouseover', hubHover);

  /* ---------- 도구 줄 선택 상자와 오른쪽 판 ---------- */
  const closeDrops = () => document.querySelectorAll('.tdrop.open').forEach(d => { d.classList.remove('open'); d.querySelector('.tdrop-btn').setAttribute('aria-expanded', 'false'); });

  // 어느 보기에서든 업무를 누르면 오른쪽 판에 그 업무를 띄운다(보기 자체 동작은 그대로)
  $('main').addEventListener('click', e => {
    if (state.detail) return;

      const id = el.dataset && Object.values(el.dataset).find(v => TASK[v]);

  }, true);
  $('node').addEventListener('click', e => {
    const b = e.target.closest('[data-sel], [data-act]');
    if (!b) return;
    if (b.dataset.sel) selectTask(b.dataset.sel);
    else if (b.dataset.act === 'detail') openDetail(b.dataset.id);
    else if (b.dataset.act === 'resume') post({ type: 'resume', label: 'Task', key: b.dataset.key });
  });

  /* ---------- 앱 데이터 연결: Swift가 window.WG.setGraph(data)로 그래프 전체를 넘긴다 ---------- */
  // 업무 = Task, 상위 분류 = 분야(Theme, 없으면 업무 종류의 최상위), 세션 = PART_OF로 업무에 속한 Session,
  // 자료 = 세션이 TOUCHED한 Resource(코드, 문서, 노트, 디자인은 산출물), 앱 = USED, 주제 = ABOUT, 문제 = HIT, 나중에 할 일 = FOR
  const OUTPUT_SUBTYPES = new Set(['CodeFile', 'Note', 'Document', 'Design']);
  const THEME_COLORS = ['#00929e', '#b48f3c', '#915a95', '#5a9e6a', '#6885c3'];
  function loadGraph(data) {
    const nodes = (data && data.nodes) || [], links = (data && data.links) || [];
    const N = new Map(nodes.map(n => [n.id, n]));
    const outs = new Map();
    links.forEach(l => { const k = l.type + ':' + l.source; (outs.get(k) || outs.set(k, []).get(k)).push(l.target); });
    const out = (type, id) => (outs.get(type + ':' + id) || []).map(x => N.get(x)).filter(Boolean);
    const up = new Map(links.filter(l => l.type === 'SUBCLASS_OF').map(l => [l.source, l.target]));
    const top = id => { while (up.has(id)) id = up.get(id); return id; };
    const uniq = a => [...new Set(a)];
    const short = x => (x.length > 40 ? x.slice(0, 39) + '…' : x);

    const today = new Date(); today.setHours(0, 0, 0, 0);
    const base = new Date(today); base.setDate(base.getDate() - (DAYS - 1));
    dayDate = d => new Date(base.getFullYear(), base.getMonth(), base.getDate() + d);
    const now = new Date(); NOW_MIN = now.getHours() * 60 + now.getMinutes();

    // 상위 분류 = 업무가 속한 분야(Task PART_OF Theme). 분야가 하나도 없으면(분야 붙이기를 끈 경우) 업무 종류의 최상위로 묶는다
    const themeOf = new Map(), tops = new Map();
    const isField = l => l.type === 'PART_OF' && N.get(l.source) && N.get(l.source).label === 'Task' && N.get(l.target) && N.get(l.target).label === 'Theme';
    const byField = links.some(isField);
    links.forEach(l => {
      if (byField) {
        if (isField(l)) { themeOf.set(l.source, l.target); tops.set(l.target, N.get(l.target)); }
        return;
      }
      if (l.type !== 'INSTANCE_OF' || !N.get(l.source) || N.get(l.source).label !== 'Task') return;
      const t = top(l.target); themeOf.set(l.source, t); if (N.get(t)) tops.set(t, N.get(t));
    });
    THEMES.length = 0;
    [...tops.values()].filter(n => n.title !== '기타').forEach((n, i) => THEMES.push({ id: 'tt' + n.id, name: n.title, color: THEME_COLORS[i % THEME_COLORS.length] }));
    // 분야로 묶을 때 아직 분야가 안 붙은 업무(분야 단계 실패 등)는 기본으로 숨는 '기타' 대신 보이는 '분야 없음' 으로
    const noField = byField && nodes.some(n => n.label === 'Task' && !themeOf.has(n.id));
    if (noField) THEMES.push({ id: 'nofield', name: '분야 없음', color: '#b9b3ae' });
    THEMES.push({ id: 'etc', name: '기타', color: '#9b9490' });

    const later = new Map();
    links.forEach(l => { if (l.type === 'FOR' && N.get(l.source)) (later.get(l.target) || later.set(l.target, []).get(l.target)).push(N.get(l.source)); });
    const sessOf = new Map();
    links.forEach(l => { if (l.type === 'PART_OF' && N.get(l.source) && N.get(l.source).label === 'Session') (sessOf.get(l.target) || sessOf.set(l.target, []).get(l.target)).push(N.get(l.source)); });

    TASKS.length = 0; SESSIONS.length = 0;
    nodes.filter(n => n.label === 'Task').forEach(tn => {
      const ss = (sessOf.get(tn.id) || []).sort((a, b) => (a.props.start || 0) - (b.props.start || 0));
      const res = ss.flatMap(s => out('TOUCHED', s.id));
      const th = N.get(themeOf.get(tn.id));
      const t = {
        id: 'n' + tn.id, key: tn.key, theme: byField && !th ? 'nofield' : !th || th.title === '기타' ? 'etc' : 'tt' + th.id, title: tn.title,
        sum: ss.map(s => s.props.summary).filter(Boolean).pop() || '', win: [0, DAYS - 1], w: 1,
        ref: uniq(res.filter(r => !OUTPUT_SUBTYPES.has(r.subtype)).map(r => short(r.title))),
        out: uniq(res.filter(r => OUTPUT_SUBTYPES.has(r.subtype)).map(r => short(r.title))),
        apps: uniq(ss.flatMap(s => out('USED', s.id)).map(a => a.title)),
        topics: uniq(out('ABOUT', tn.id).map(x => x.title)),
        problems: uniq(ss.flatMap(s => out('HIT', s.id)).map(p => p.title)).map(p => [p, '']),
        later: (later.get(tn.id) || []).map(x => short(x.title)),
      };
      TASKS.push(t);
      ss.forEach(s => {
        if (!s.props.start) return;
        const st = new Date(s.props.start * 1000), day = new Date(st); day.setHours(0, 0, 0, 0);
        const d = Math.round((day - base) / 86400000);
        if (d < 0 || d >= DAYS) return;
        const start = st.getHours() * 60 + st.getMinutes();
        const len = Math.max(1, Math.round(((s.props.end || s.props.start) - s.props.start) / 60), Math.round((s.props.active_seconds || 0) / 60));
        SESSIONS.push({ task: t, d, start, end: Math.min(24 * 60, start + len), app: (out('USED', s.id)[0] || {}).title || '', kind: null });
      });
    });
    SESSIONS.sort((a, b) => a.d - b.d || a.start - b.start);
    Object.keys(TASK).forEach(k => delete TASK[k]); TASKS.forEach(t => { TASK[t.id] = t; });
    Object.keys(THEME).forEach(k => delete THEME[k]); THEMES.forEach(t => { THEME[t.id] = t; });
    if (state.detail && !TASK[state.detail]) state.detail = null;
    if (state.focus && !TASK[state.focus]) state.focus = null;
  }
  const post = m => { try { window.webkit.messageHandlers.wg.postMessage(m); } catch (_) { /* 브라우저에서 열었을 때 */ } };
  window.WG = { setGraph(data) { loadGraph(data); render(); }, select() {} };
  if (window.__WG_DATA__) loadGraph(window.__WG_DATA__);

  const qm = new URLSearchParams(location.search).get('mode');
  if (qm) { state.mode = qm; setSeg($('mode'), 'mode', qm); }
  state.focus = new URLSearchParams(location.search).get('focus');
  render();
  post({ type: 'ready' });
})();
</script>
</body>
</html>
